<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" font-family="HD Colton, Helvetica Neue, Arial, sans-serif">
  <!-- Background -->
  <rect width="820" height="240" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#11224E" letter-spacing="-0.3">TWIN Supply Chain - Data Flow</text>

  <!-- ── Box 1: Freight Forwarder ── -->
  <rect x="20" y="58" width="160" height="96" rx="10" fill="#FFEFE4" stroke="#FFC99F" stroke-width="2"/>
  <text x="100" y="83" text-anchor="middle" font-size="8.5" font-weight="700" fill="#D56711" letter-spacing="1">FREIGHT FORWARDER</text>
  <line x1="40" y1="91" x2="160" y2="91" stroke="#FFC99F" stroke-width="1"/>
  <text x="100" y="110" text-anchor="middle" font-size="11" fill="#272D35">Publishes</text>
  <text x="100" y="127" text-anchor="middle" font-size="11" fill="#272D35">consignment once</text>
  <text x="100" y="144" text-anchor="middle" font-size="10" fill="#D56711">via REST API</text>

  <!-- Arrow 1 -->
  <line x1="185" y1="106" x2="258" y2="106" stroke="#11224E" stroke-width="2"/>
  <polygon points="255,100 267,106 255,112" fill="#11224E"/>
  <text x="224" y="98" text-anchor="middle" font-size="9" fill="#5D646D">publish</text>

  <!-- ── Box 2: TWIN Supply Chain Node ── -->
  <rect x="270" y="44" width="280" height="124" rx="10" fill="#11224E" stroke="#11224E" stroke-width="2"/>
  <!-- Orange accent bar -->
  <rect x="270" y="44" width="280" height="5" rx="3" fill="#FF7C15"/>
  <text x="410" y="78" text-anchor="middle" font-size="9" font-weight="700" fill="#FF7C15" letter-spacing="1">TWIN SUPPLY CHAIN NODE</text>
  <line x1="290" y1="86" x2="530" y2="86" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="410" y="106" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Routes by UN/LOCODE port</text>
  <text x="410" y="123" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Enforces access policies</text>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Tamper-evident audit trail</text>
  <text x="410" y="158" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">Built on TWIN-Core</text>

  <!-- Arrow 2 -->
  <line x1="555" y1="88" x2="620" y2="70" stroke="#11224E" stroke-width="2"/>
  <polygon points="616,63 625,68 618,75" fill="#11224E"/>
  <line x1="555" y1="118" x2="620" y2="143" stroke="#11224E" stroke-width="2"/>
  <polygon points="616,137 625,143 617,150" fill="#11224E"/>
  <text x="586" y="104" text-anchor="middle" font-size="9" fill="#5D646D">route</text>

  <!-- ── Box 3a: Border Agency ── -->
  <rect x="632" y="44" width="168" height="78" rx="10" fill="#E3EDFB" stroke="#9EC1F4" stroke-width="2"/>
  <text x="716" y="69" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1156BD" letter-spacing="1">BORDER AGENCY</text>
  <line x1="652" y1="77" x2="780" y2="77" stroke="#9EC1F4" stroke-width="1"/>
  <text x="716" y="96" text-anchor="middle" font-size="11" fill="#272D35">ISN pre-notification</text>
  <text x="716" y="112" text-anchor="middle" font-size="10" fill="#1568E4">automatic</text>

  <!-- ── Box 3b: Port Operator ── -->
  <rect x="632" y="138" width="168" height="78" rx="10" fill="#E3EDFB" stroke="#9EC1F4" stroke-width="2"/>
  <text x="716" y="163" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1156BD" letter-spacing="1">PORT OPERATOR</text>
  <line x1="652" y1="171" x2="780" y2="171" stroke="#9EC1F4" stroke-width="1"/>
  <text x="716" y="190" text-anchor="middle" font-size="11" fill="#272D35">AUT v2.1 / Destin8</text>
  <text x="716" y="206" text-anchor="middle" font-size="10" fill="#1568E4">booking notification</text>

  <!-- Caption -->
  <text x="410" y="224" text-anchor="middle" font-size="10" fill="#A5ADB8">One consignment submission routes automatically to all authorised recipients</text>
</svg>
