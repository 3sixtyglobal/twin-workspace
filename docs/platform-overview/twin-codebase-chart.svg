<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 198" width="680" height="198" font-family="HD Colton, Helvetica Neue, Arial, sans-serif">
  <rect width="680" height="198" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#11224E" letter-spacing="-0.3">Codebase by Lines of Code</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#A5ADB8">TypeScript source lines, excluding generated code, tests and node_modules</text>

  <!-- Segmented bar — total 640px wide, 2px gaps between segments
       Total: 641,703 lines
       TWIN-Core   91.0%  → 578px  (x=20)
       SC Backend   5.8%  →  37px  (x=600)
       SC Frontend  3.3%  →  21px  (x=639) -->
  <clipPath id="bar-clip">
    <rect x="20" y="58" width="640" height="34" rx="6"/>
  </clipPath>
  <g clip-path="url(#bar-clip)">
    <rect x="20"  y="58" width="578" height="34" fill="#FF7C15"/>
    <rect x="600" y="58" width="37"  height="34" fill="#1568E4"/>
    <rect x="639" y="58" width="21"  height="34" fill="#11224E"/>
  </g>
  <!-- Percentage label inside the dominant segment -->
  <text x="309" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">91%</text>

  <!-- Legend -->
  <!-- Row 1 -->
  <rect x="20" y="108" width="14" height="14" rx="3" fill="#FF7C15"/>
  <text x="40"  y="120" font-size="12" font-weight="600" fill="#11224E">TWIN-Core</text>
  <text x="220" y="120" font-size="12" font-weight="700" fill="#FF7C15">91%</text>
  <text x="260" y="120" font-size="12" fill="#5D646D">583,071 lines</text>

  <!-- Row 2 -->
  <rect x="20" y="132" width="14" height="14" rx="3" fill="#1568E4"/>
  <text x="40"  y="144" font-size="12" font-weight="600" fill="#11224E">Supply Chain Backend</text>
  <text x="220" y="144" font-size="12" font-weight="700" fill="#1568E4">6%</text>
  <text x="260" y="144" font-size="12" fill="#5D646D">37,430 lines</text>

  <!-- Row 3 -->
  <rect x="20" y="156" width="14" height="14" rx="3" fill="#11224E"/>
  <text x="40"  y="168" font-size="12" font-weight="600" fill="#11224E">Supply Chain Frontend</text>
  <text x="220" y="168" font-size="12" font-weight="700" fill="#11224E">3%</text>
  <text x="260" y="168" font-size="12" fill="#5D646D">21,202 lines</text>

  <!-- Caption -->
  <text x="340" y="190" text-anchor="middle" font-size="10" fill="#A5ADB8">TWIN-Core underpins all application code above it</text>
</svg>
