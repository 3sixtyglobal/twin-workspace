name: Align Branches

# Aligns all submodules to their latest next branch, commits and pushes,
# then merges next into main, aligns submodules to main, commits and pushes.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  align-next:
    name: Align next branch
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
          ref: next
          submodules: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Import GPG key
        run: |
          echo "${{ secrets.TWIN_GPG_PRIVATE_KEY }}" | base64 --decode | gpg --import
          echo "TWIN_GPG_KEY_ID=${{ secrets.TWIN_GPG_KEY_ID }}" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.email "github@twindev.org"
          git config --global user.name "TWIN GitHub Bot"
          git config --global user.signingkey "$TWIN_GPG_KEY_ID"
          git config --global commit.gpgsign true

      - name: Align submodules to next
        run: npm run submodule:align-next

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No next submodule changes to commit."
          else
            git commit -S -m "chore: update next submodules"
            git push origin next
          fi

      - name: Cleanup GPG key
        if: always()
        run: |
          FINGERPRINT=$(gpg --list-secret-keys --with-colons "$TWIN_GPG_KEY_ID" | awk -F: '/fpr:/ {print $10}' | head -1)
          if [ -n "$FINGERPRINT" ]; then
            gpg --batch --yes --delete-secret-keys "$FINGERPRINT" || true
            gpg --batch --yes --delete-keys "$FINGERPRINT" || true
          fi

  align-main:
    name: Align main branch
    needs: align-next
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Import GPG key
        run: |
          echo "${{ secrets.TWIN_GPG_PRIVATE_KEY }}" | base64 --decode | gpg --import
          echo "TWIN_GPG_KEY_ID=${{ secrets.TWIN_GPG_KEY_ID }}" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.email "github@twindev.org"
          git config --global user.name "TWIN GitHub Bot"
          git config --global user.signingkey "$TWIN_GPG_KEY_ID"
          git config --global commit.gpgsign true

      - name: Apply next changes to main
        run: |
          git fetch origin next
          # Apply the exact diff from main → next as a single patch.
          # Using diff | apply bypasses the merge algorithm entirely — no
          # conflicts to resolve and no next commits pulled into main history.
          # Correctly handles all cases: adds, modifies, deletes, and renames.
          git diff --binary origin/main origin/next | git apply --index

      - name: Align submodules to main
        run: npm run submodule:align-main

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No main submodule changes to commit."
          else
            git commit -S -m "chore: update main submodules"
            git push origin main
          fi

      - name: Cleanup GPG key
        if: always()
        run: |
          FINGERPRINT=$(gpg --list-secret-keys --with-colons "$TWIN_GPG_KEY_ID" | awk -F: '/fpr:/ {print $10}' | head -1)
          if [ -n "$FINGERPRINT" ]; then
            gpg --batch --yes --delete-secret-keys "$FINGERPRINT" || true
            gpg --batch --yes --delete-keys "$FINGERPRINT" || true
          fi
