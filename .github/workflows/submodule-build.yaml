name: Workspace Submodule Build

# Run automatically for changes on next and allow manual execution.
on:
  workflow_dispatch:
  # Allow external repositories (submodules) to trigger this workflow.
  repository_dispatch:
    types:
      - submodule-changed
  pull_request:
    branches:
      - next
  push:
    branches:
      - next

# Cancel older in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-submodules:
    # Read the submodule list from package.json once and expose it as a matrix.
    runs-on: ubuntu-latest
    outputs:
      submodules: ${{ steps.get-submodules.outputs.submodules }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHA_RELEASE_TOKEN }}
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read submodules from package.json
        id: get-submodules
        run: |
          submodules_json=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          process.stdout.write(JSON.stringify(packageJson.submodules ?? []));
          NODE
          )
          echo "submodules=$submodules_json" >> "$GITHUB_OUTPUT"

  build-submodules:
    # Build each submodule independently with per-submodule cache keys.
    needs: read-submodules
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        submodule: ${{ fromJson(needs.read-submodules.outputs.submodules) }}

    steps:
      # Checkout only the workspace repository metadata first.
      - name: Checkout workspace repository
        uses: actions/checkout@v4
        with:
          # Required for private submodules; this token must have read access
          # to twinfoundation/workspace and all private submodule repositories.
          token: ${{ secrets.GHA_RELEASE_TOKEN }}
          submodules: false
          fetch-depth: 1

      # Initialise only the selected submodule for this matrix job.
      - name: Checkout selected submodule
        run: |
          git submodule sync -- ${{ matrix.submodule }}
          git submodule update --init --recursive --depth 1 -- ${{ matrix.submodule }}

      # Use the Node.js version aligned with workspace requirements.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.submodule }}/package-lock.json
            ${{ matrix.submodule }}/packages/*/package-lock.json
            ${{ matrix.submodule }}/apps/*/package-lock.json

      # Cache node_modules for the current submodule only.
      - name: Cache node_modules for submodule
        id: submodule-node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.submodule }}/node_modules
            ${{ matrix.submodule }}/packages/*/node_modules
            ${{ matrix.submodule }}/apps/*/node_modules
          key: ${{ matrix.submodule }}-${{ hashFiles(format('{0}/package-lock.json', matrix.submodule), format('{0}/packages/*/package-lock.json', matrix.submodule), format('{0}/apps/*/package-lock.json', matrix.submodule)) }}
          restore-keys: |
            ${{ matrix.submodule }}-

      # Install dependencies for the current submodule if cache miss.
      - name: Install submodule dependencies
        if: steps.submodule-node-modules-cache.outputs.cache-hit != 'true'
        run: npm install
        working-directory: ${{ matrix.submodule }}

      # Build current submodule while skipping tests as we don't have the docker test environments.
    #   - name: Build submodule (no test)
    #     run: npm run dist:no-test
    #     working-directory: ${{ matrix.submodule }}
