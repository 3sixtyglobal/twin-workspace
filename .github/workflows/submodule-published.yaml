name: Workspace Submodule Build

# Run automatically for main and next (separate schedules) and allow manual execution.
on:
  schedule:
    # Main branch build window (weekdays at 00:00 UTC).
    - cron: '0 0 * * 1-5'
    # Next branch build window (weekdays at 00:30 UTC).
    - cron: '30 0 * * 1-5'
    # Main branch build window (weekdays at 12:00 UTC).
    - cron: '0 12 * * 1-5'
    # Next branch build window (weekdays at 12:30 UTC).
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      releaseType:
        description: Release type to build
        required: true
        type: choice
        default: '🚧 prerelease (next branch)'
        options:
          - '🚧 prerelease (next branch)'
          - '🚀 production (main branch)'
      runTesting:
        description: Run submodule builds with testing enabled
        required: true
        type: choice
        default: '⚡ no-test'
        options:
          - '⚡ no-test'
          - '🧪 test'
  # Allow external repositories (submodules) to trigger this workflow.
  repository_dispatch:
    types:
      - submodule-published

# Cancel older in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-submodules:
    # Read the submodule list from package.json once and expose it as a matrix.
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"twin","labels":"self-hosted"}') || 'ubuntu-latest' }}

    outputs:
      submodules: ${{ steps.get-submodules.outputs.submodules }}
      branch: ${{ steps.set-branch.outputs.branch }}

    steps:
      - name: Set target branch
        id: set-branch
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            BRANCH="${{ github.event.client_payload.branch }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 0 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then
              BRANCH="main"
            else
              BRANCH="next"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [[ "${{ github.event.inputs.releaseType }}" == *"main"* ]]; then
            BRANCH="main"
          else
            BRANCH="next"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
          ref: ${{ steps.set-branch.outputs.branch }}
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read submodules from package.json
        id: get-submodules
        run: |
          submodules_json=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          process.stdout.write(JSON.stringify(packageJson.submodules ?? []));
          NODE
          )
          echo "submodules=$submodules_json" >> "$GITHUB_OUTPUT"

  build-submodules:
    # Build each submodule independently with per-submodule cache keys.
    needs: read-submodules
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"twin","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 180
    strategy:
      max-parallel: 4
      fail-fast: true
      matrix:
        submodule: ${{ fromJson(needs.read-submodules.outputs.submodules) }}

    steps:
      # Checkout the selected repository directly from GitHub.
      - name: Checkout selected repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
          repository: 3sixtyglobal/${{ matrix.submodule }}
          ref: ${{ needs.read-submodules.outputs.branch }}
          path: ${{ matrix.submodule }}
          submodules: false
          fetch-depth: 1

      # Use the Node.js version aligned with workspace requirements.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.submodule }}/package.json

      # Remove lock files so dependency install resolves latest versions.
      - name: Remove lock files
        run: find . -type f -name "pnpm-lock.yaml" -delete
        working-directory: ${{ matrix.submodule }}

      # Install dependencies for the current submodule.
      - name: Install submodule dependencies
        run: pnpm install
        working-directory: ${{ matrix.submodule }}

      # Resolve testing mode to a simple boolean flag for later steps.
      - name: Resolve testing mode
        id: testing-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.runTesting }}" = "🧪 test" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Prepare setup-test-env composite action for this submodule.
      - name: Prepare setup-test-env action
        if: ${{ steps.testing-mode.outputs.enabled == 'true' }}
        run: |
          rm -rf ./.tmp/setup-test-env
          mkdir -p ./.tmp
          cp -R "${{ matrix.submodule }}/.github/workflows/setup-test-env" ./.tmp/setup-test-env

      # Setup test environment using the submodule composite action.
      - name: Setup test environment
        if: ${{ steps.testing-mode.outputs.enabled == 'true' }}
        uses: ./.tmp/setup-test-env
        with:
          package: ${{ matrix.submodule }}

      # Build current submodule (with or without tests based on workflow input).
      - name: Build submodule
        run: |
          if [ "${{ steps.testing-mode.outputs.enabled }}" = "true" ]; then
            pnpm run dist
          else
            pnpm run dist:no-test
          fi
        working-directory: ${{ matrix.submodule }}

      # Prepare teardown-test-env composite action for this submodule.
      - name: Prepare teardown-test-env action
        if: ${{ always() && steps.testing-mode.outputs.enabled == 'true' }}
        run: |
          rm -rf ./.tmp/teardown-test-env
          mkdir -p ./.tmp
          cp -R "${{ matrix.submodule }}/.github/workflows/teardown-test-env" ./.tmp/teardown-test-env

      # Teardown test environment using the submodule composite action.
      - name: Teardown test environment
        if: ${{ always() && steps.testing-mode.outputs.enabled == 'true' }}
        uses: ./.tmp/teardown-test-env
