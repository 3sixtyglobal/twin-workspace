name: Workspace Submodule Build

# Run automatically for changes on next and allow manual execution.
on:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      runTesting:
        description: Run submodule builds with testing enabled
        required: true
        type: choice
        default: '⚡ no-test'
        options:
          - '⚡ no-test'
          - '🧪 test'
  # Allow external repositories (submodules) to trigger this workflow.
  repository_dispatch:
    types:
      - submodule-published

# Cancel older in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-submodules:
    # Read the submodule list from package.json once and expose it as a matrix.
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    outputs:
      submodules: ${{ steps.get-submodules.outputs.submodules }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read submodules from package.json
        id: get-submodules
        run: |
          submodules_json=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          process.stdout.write(JSON.stringify(packageJson.submodules ?? []));
          NODE
          )
          echo "submodules=$submodules_json" >> "$GITHUB_OUTPUT"

  build-submodules:
    # Build each submodule independently with per-submodule cache keys.
    needs: read-submodules
    runs-on:
      labels: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
      group: ${{ github.event.repository.private && 'twin' || 'default' }}
    timeout-minutes: 180
    strategy:
      max-parallel: 4
      fail-fast: true
      matrix:
        submodule: ${{ fromJson(needs.read-submodules.outputs.submodules) }}

    steps:
      # Checkout the selected repository directly from GitHub.
      - name: Checkout selected repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TWIN_GHA_RELEASE_TOKEN }}
          repository: iotaledger/${{ matrix.submodule }}
          ref: next
          path: ${{ matrix.submodule }}
          submodules: false
          fetch-depth: 1

      # Use the Node.js version aligned with workspace requirements.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Remove lock files so dependency install resolves latest versions.
      - name: Remove package-lock files
        run: find . -type f -name "package-lock.json" -delete
        working-directory: ${{ matrix.submodule }}

      # Install dependencies for the current submodule.
      - name: Install submodule dependencies
        run: npm install
        working-directory: ${{ matrix.submodule }}

      # Resolve testing mode to a simple boolean flag for later steps.
      - name: Resolve testing mode
        id: testing-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.runTesting }}" = "🧪 test" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Prepare setup-test-env composite action for this submodule.
      - name: Prepare setup-test-env action
        if: ${{ steps.testing-mode.outputs.enabled == 'true' }}
        run: |
          rm -rf ./.tmp/setup-test-env
          mkdir -p ./.tmp
          cp -R "${{ matrix.submodule }}/.github/workflows/setup-test-env" ./.tmp/setup-test-env

      # Setup test environment using the submodule composite action.
      - name: Setup test environment
        if: ${{ steps.testing-mode.outputs.enabled == 'true' }}
        uses: ./.tmp/setup-test-env
        with:
          package: ${{ matrix.submodule }}

      # Build current submodule (with or without tests based on workflow input).
      - name: Build submodule
        run: |
          if [ "${{ steps.testing-mode.outputs.enabled }}" = "true" ]; then
            npm run dist
          else
            npm run dist:no-test
          fi
        working-directory: ${{ matrix.submodule }}

      # Prepare teardown-test-env composite action for this submodule.
      - name: Prepare teardown-test-env action
        if: ${{ always() && steps.testing-mode.outputs.enabled == 'true' }}
        run: |
          rm -rf ./.tmp/teardown-test-env
          mkdir -p ./.tmp
          cp -R "${{ matrix.submodule }}/.github/workflows/teardown-test-env" ./.tmp/teardown-test-env

      # Teardown test environment using the submodule composite action.
      - name: Teardown test environment
        if: ${{ always() && steps.testing-mode.outputs.enabled == 'true' }}
        uses: ./.tmp/teardown-test-env
